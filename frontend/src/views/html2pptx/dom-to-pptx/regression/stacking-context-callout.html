<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>html2pptx stacking-context callout regression</title>
    <style>
      .slide {
        position: relative;
        width: 960px;
        height: 540px;
        background: #f8fafc;
        font-family: Arial, sans-serif;
      }

      .left-container {
        position: absolute;
        left: 64px;
        top: 72px;
        width: 430px;
        height: 360px;
        background: #dbeafe;
        border: 2px solid #60a5fa;
      }

      .callout-box {
        position: absolute;
        z-index: 10;
        left: 300px;
        top: 108px;
        width: 260px;
        height: 120px;
        padding: 18px;
        box-sizing: border-box;
        background: #f97316;
        color: #ffffff;
        font-weight: 700;
        border-radius: 18px;
        box-shadow: 0 12px 24px rgba(15, 23, 42, 0.22);
      }

      .right-panel {
        position: relative;
        z-index: 1;
        margin-left: 520px;
        top: 96px;
        width: 300px;
        height: 290px;
        padding: 28px;
        box-sizing: border-box;
        background: #334155;
        color: #ffffff;
        border-radius: 20px;
      }
    </style>
  </head>
  <body>
    <div class="slide" data-pptx-export-target="true">
      <div class="left-container">
        <!-- Expected: this z-index:10 positioned child is in the root stacking context. -->
        <div class="callout-box">Callout should export above the right panel</div>
      </div>
      <!-- Expected: this z-index:1 stacking context exports below .callout-box in PPT. -->
      <div class="right-panel">Right panel (z-index: 1)</div>
    </div>
  </body>
</html>
